<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Canva VN · Banner “Ý tưởng Việt”</title>
<style>
@font-face{font-family:"InterD";font-weight:700;src:url(../fonts/interd-700.woff) format("woff")}
@font-face{font-family:"InterD";font-weight:800;src:url(../fonts/interd-800.woff) format("woff")}
@font-face{font-family:"InterD";font-weight:900;src:url(../fonts/interd-900.woff) format("woff")}
@font-face{font-family:"Inter";font-weight:500;src:url(../fonts/inter-500.woff) format("woff")}
@font-face{font-family:"Inter";font-weight:600;src:url(../fonts/inter-600.woff) format("woff")}
@font-face{font-family:"Inter";font-weight:700;src:url(../fonts/inter-700.woff) format("woff")}
/* tokens lấy từ banner dọc "Ý tưởng Việt" */
:root{--paper:#F5E7D1;--ink:#1B1D4E;--ink2:#4A4870;--pur:#8B3DFF;--blu:#4A6CE8;--cta:#7B3FF2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper)}
body{font-family:"Inter",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
#b{position:relative;overflow:hidden;background:var(--paper)}
.abs{position:absolute}
.art{position:absolute;display:block}
.wm{position:absolute;mix-blend-mode:multiply}
.kick{font-family:"InterD";font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.h1{font-family:"InterD";font-weight:900;letter-spacing:-.02em;line-height:1.18;color:var(--ink)}
.gt{background:linear-gradient(90deg,var(--pur) 0%,#7A5BFF 55%,var(--blu) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.sub{font-family:"Inter";font-weight:600;line-height:1.4;color:var(--ink2)}
.sub b{color:var(--ink);font-weight:700}
.cta{position:absolute;display:flex;align-items:center;justify-content:center;gap:.7em;border-radius:999px;background:linear-gradient(100deg,var(--cta),#6A4BFF);color:#fff;
  font-family:"InterD";font-weight:800;letter-spacing:.02em;white-space:nowrap;box-shadow:0 14px 34px rgba(91,52,220,.32),inset 0 0 0 2px rgba(255,255,255,.18)}
.chip{position:absolute;display:inline-flex;align-items:center;gap:.6em;border-radius:999px;background:rgba(255,255,255,.62);border:2px solid rgba(123,63,242,.25);
  font-family:"Inter";font-weight:700;color:var(--ink);white-space:nowrap}
.chip i{display:block;width:.62em;height:.62em;border-radius:50%;background:var(--pur)}
.guide{position:absolute;pointer-events:none;border:3px dashed rgba(230,40,40,.9);background:rgba(230,40,40,.07);display:none;z-index:50}
body.guides .guide{display:block}
</style>
</head>
<body>
<div id="b"></div>
<script>
const P=new URLSearchParams(location.search), V=P.get('v')||'square';
if(P.has('guides')) document.body.classList.add('guides');
const SZ={square:[1200,1200],story:[1080,1920],cover:[1640,624],web:[1920,600]}[V];
const b=document.getElementById('b'); b.style.width=SZ[0]+'px'; b.style.height=SZ[1]+'px';
const H=(s)=>b.insertAdjacentHTML('beforeend',s);
const arrow=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>`;
const art=(f,css)=>H(`<img class="art" src="art/${f}" alt="" style="${css}">`);
const wm=(x,y,w)=>H(`<img class="wm" src="art/wordmark.png" alt="Canva" style="left:${x}px;top:${y}px;width:${w}px">`);
const guide=(x,y,w,h)=>H(`<div class="guide" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>`);

/* Story 9:16 · TikTok, IG/FB Story · sinh viên 18–22: hình gốc của nhóm (đã xóa chữ), chữ dựng lại theo hệ chung */
if(V==='story'){
  art('story.jpg','left:0;top:0;width:1080px;height:1920px;object-fit:cover');
  // mọi chữ trong vùng an toàn y 250–1670, x 65–1015
  wm(90,262,190);
  H(`<div class="h1 abs" style="left:92px;top:350px;font-size:80px">Ý tưởng Việt.<br><span class="gt">Sáng tạo không giới hạn.</span></div>`);
  H(`<div class="sub abs" style="left:96px;top:1474px;width:620px;font-size:32px;color:var(--ink)">Biến ý tưởng thành<br>thiết kế của riêng bạn.</div>`);
  H(`<div class="cta" style="left:92px;top:1584px;height:80px;padding:0 38px;font-size:28px">KHÁM PHÁ CANVA AI ${arrow(28)}</div>`);
  guide(0,0,1080,250); guide(0,1670,1080,250);
}

/* Feed 1:1 · Facebook Feed · người mới đi làm 22–26: slide, CV, báo cáo cần làm nhanh */
if(V==='square'){
  // chữ canh giữa, nằm trong lõi 810 px (lưới 3:4 của Instagram cắt 195 px mỗi bên)
  art('feed.jpg','left:20px;top:104px;width:1160px;height:1160px;-webkit-mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(transparent,#000 10%,#000 86%,transparent);-webkit-mask-composite:source-in;mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(transparent,#000 10%,#000 86%,transparent);mask-composite:intersect');
  wm(530,54,140);
  H(`<div class="h1 abs" style="left:0;width:1200px;text-align:center;top:124px;font-size:84px">Slide họp sáng mai?<br><span class="gt">Có mẫu đấy!</span></div>`);
  H(`<div class="sub abs" style="left:0;width:1200px;text-align:center;top:336px;font-size:26px">Chọn mẫu tiếng Việt, để <b>Soạn thảo Magic</b> viết nháp giúp bạn.</div>`);
  H(`<div class="cta" style="left:390px;top:1062px;width:420px;height:82px;font-size:28px">THỬ NGAY HÔM NAY ${arrow(28)}</div>`);
  H(`<div class="abs" style="left:0;width:1200px;text-align:center;top:1160px;font:600 22px/1 Inter;color:var(--ink2)">Dùng thử Canva Pro <b style="color:var(--ink)">miễn phí 30 ngày</b> · canva.com</div>`);
  guide(195,0,810,1200);
}

/* Cover Fanpage · mọi phân khúc vào Page: xác nhận đúng thương hiệu, không vẽ CTA */
if(V==='cover'){
  art('cover.jpg','left:0;top:-40px;width:1640px;height:703px');
  wm(675,74,190);
  H(`<div class="kick abs" style="left:0;width:1540px;text-align:center;top:174px;font-size:22px;color:var(--ink2)">Đã chính thức có mặt tại Việt Nam</div>`);
  H(`<div class="h1 abs" style="left:0;width:1540px;text-align:center;top:214px;font-size:54px">Ý tưởng Việt.<br><span class="gt">Sáng tạo không giới hạn.</span></div>`);
  H(`<div class="chip" style="left:490px;top:378px;width:560px;justify-content:center;height:54px;font-size:21px"><i></i>Thiết kế tiếng Việt, chuẩn từng dấu · canva.com</div>`);
  guide(270,0,1100,624); // headline 54 px, tâm lệch trái 50 px: cách diều bên trái và quả cầu bên phải ~100 px mỗi bên
}

/* Header website · người đã có ý định mua: lợi ích Pro, ví quen thuộc, nút rõ */
if(V==='web'){
  art('web.jpg','right:-40px;top:0;height:600px;width:1400px;-webkit-mask:linear-gradient(90deg,transparent 0,#000 18%);mask:linear-gradient(90deg,transparent 0,#000 18%)');
  wm(238,62,160);
  H(`<div class="h1 abs" style="left:240px;top:142px;font-size:70px">Thiết kế như dân chuyên,<br><span class="gt">miễn phí 30 ngày đầu.</span></div>`);
  H(`<div class="sub abs" style="left:242px;top:330px;width:760px;font-size:24px">Hơn 100 triệu ảnh, video, phông chữ cao cấp và Canva AI 2.0. Thanh toán bằng <b>MoMo, ZaloPay, ShopeePay</b>.</div>`);
  H(`<div class="cta" style="left:242px;top:440px;height:76px;padding:0 36px;font-size:26px">BẮT ĐẦU DÙNG THỬ MIỄN PHÍ ${arrow(26)}</div>`);
  H(`<div class="abs" style="left:780px;top:463px;font:700 22px/1.2 Inter;color:var(--ink2)">canva.com/vi_vn</div>`);
  guide(240,0,1440,600);
}
document.fonts.ready.then(()=>{document.body.dataset.ready=1});
</script>
</body>
</html>
